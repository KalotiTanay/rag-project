version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragqa
      POSTGRES_USER: ragqa
      POSTGRES_PASSWORD: ragqa_local_dev
    ports:
      - "5432:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragqa -d ragqa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_pg_data:
